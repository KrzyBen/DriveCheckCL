services:
  db:
    image: postgres:16
    container_name: drivecheck-db
    env_file:
      - ../server/backend-api/.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${DATABASE}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build: ../server/backend-api
    container_name: drivecheck-backend-api
    env_file:
      - ../server/backend-api/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ../server/storage:/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 300s
      timeout: 10s
      retries: 3

  backend-ia:
    build: ../server/backend-ia
    container_name: drivecheck-backend-ia
    env_file:
      - ../server/backend-api/.env   # reutiliza INTERNAL_API_KEY (debe ser el mismo secreto en ambos lados)
    environment:
      BACKEND_API_URL: http://backend-api:8000/api
      STORAGE_ROOT: /storage
      N_FRAMES: 24
      MAX_VIDEOS_POR_REPORTE: 3
    volumes:
      - ../server/storage:/storage:ro   # solo lectura: backend-ia no debe escribir videos
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    # Sin "ports": no se expone al host, solo backend-api puede llamarlo
    # dentro de la red interna de docker-compose.

  frontend:
    build:
      context: ../server/frontend
    container_name: drivecheck-frontend
    environment:
      VITE_BASE_URL: ${VITE_BASE_URL}
    volumes:
      - ../server/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend-api

volumes:
  db-data: